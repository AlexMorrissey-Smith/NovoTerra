name: Novoterra
options:
  bundleIdPrefix: com.novoterra
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Novoterra:
    type: application
    platform: iOS
    sources:
      - path: Novoterra
    settings:
      base:
        INFOPLIST_FILE: Novoterra/Info.plist
        CODE_SIGN_ENTITLEMENTS: Novoterra/Novoterra.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.novoterra.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SWCompression

  NovoterraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NovoterraTests
    dependencies:
      - target: Novoterra

packages:
  SWCompression:
    url: https://github.com/tsolomko/SWCompression.git
    from: "4.8.0"

schemes:
  Novoterra:
    build:
      targets:
        Novoterra: all
    run:
      config: Debug
    test:
      targets:
        - NovoterraTests
