name: NovoTerra
options:
  bundleIdPrefix: com.novoterra
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: AUF37YGA3G

targets:
  NovoTerra:
    type: application
    platform: iOS
    sources:
      - path: Novoterra
        excludes:
          - "AppIcon.icon"
          - "**/.DS_Store"
      - path: Novoterra/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Novoterra/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: NovoTerra
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.navigation
        CODE_SIGN_ENTITLEMENTS: Novoterra/Novoterra.entitlements
        CODE_SIGN_IDENTITY: "iPhone Developer"
        PRODUCT_BUNDLE_IDENTIFIER: com.novoterra.app
        PRODUCT_NAME: NovoTerra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "6"

  NovoTerraTests:
    type: bundle.unit-test
    platform: iOS
    # Logic tests: compile the app's model and service code directly instead of
    # hosting inside the app, so they run without launching the UI.
    sources:
      - path: NovoterraTests
      - path: Novoterra/Models
      - path: Novoterra/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novoterra.NovoterraTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Novoterra:
    build:
      targets:
        NovoTerra: all
        NovoTerraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NovoTerraTests
